plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.company.salesapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.company.salesapp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0-dev"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ==== BASE URL LARAVEL ====
        // DEV (Laragon lokal, diakses dari Android Emulator):
        // buildConfigField "String", "BASE_URL", "\"http://10.0.2.2:8000/\""
        // DEV (Laragon lokal, diakses dari HP FISIK lewat WiFi yang sama):
        buildConfigField "String", "BASE_URL", "\"http://192.168.1.11:8000/\""
        // Ganti ke domain produksi nanti, contoh:
        // buildConfigField "String", "BASE_URL", "\"https://domain-perusahaan.com/\""
    }

    buildTypes {
        debug {
            // Izinkan HTTP (cleartext) khusus untuk dev lokal Laragon
            manifestPlaceholders += [usesCleartextTraffic: "true"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders += [usesCleartextTraffic: "false"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Networking -> Laravel API
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Room -> Local Location Queue (offline)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    // WorkManager -> Sync Manager (retry, background sync)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Location -> Fused Location Provider (physical GPS)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // MapLibre Android (Phase D - map, aktifkan saat mulai Phase D)
    implementation 'org.maplibre.gl:android-sdk:11.5.2'

    // Security -> EncryptedSharedPreferences untuk token
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
